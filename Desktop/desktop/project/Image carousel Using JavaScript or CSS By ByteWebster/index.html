<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carousel Using JavaScript or CSS</title>
    <!-- css -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- www.bytewebster.com -->
    <!-- www.bytewebster.com -->
    <!-- www.bytewebster.com -->
  </head>
  <body>
    <main>
      <div id="carousel" class="carousel">
        <div id="iten_1" class="hideLeft">
          <img src="img/1.jpg" />
        </div>

        <div id="item_2" class="prevLeftSecond">
          <img src="img/2.jpg" />
        </div>

        <div id="item_3" class="prev">
          <img src="img/3.jpg" />
        </div>

        <div id="item_4" class="selected">
          <img src="img/1.jpg" />
        </div>

        <div id="item_5" class="next">
          <img src="img/2.jpg" />
        </div>

        <div id="item_6" class="nextRightSecond">
          <img src="img/3.jpg" />
        </div>

        <div id="item_7" class="hideRight">
          <img src="img/1.jpg" />
        </div>

        <div id="item_8" class="hideRight">
          <img src="img/2.jpg" />
        </div>
      </div>

      <div class="buttons">
        <button class="button-82-pushable" role="button" id="prev">
          <span class="button-82-shadow"></span
          ><span class="button-82-edge"></span
          ><span class="button-82-front text">Previous</span>
        </button>

        <button class="button-82-pushable" role="button" id="next">
          <span class="button-82-shadow"></span
          ><span class="button-82-edge"></span
          ><span class="button-82-front text">Next</span>
        </button>
      </div>
    </main>
    <!-- script -->
    <script type="text/javascript" src="js/script.js"></script>
  </body>
</html>
